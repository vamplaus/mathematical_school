<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04090e">
<title>Математическая школа №1 — живая карта</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div id="loader" aria-live="polite">
  <div class="loader-orbit"></div><div class="loader-mark">МШ</div>
  <b>МАТЕМАТИЧЕСКАЯ ШКОЛА №1</b><span id="loaderText">ПОДГОТОВКА ПРОСТРАНСТВА</span>
  <button id="retry" type="button" hidden>ПОВТОРИТЬ</button>
</div>

<main id="app" aria-hidden="true" inert hidden>
  <div id="viewport" role="region" tabindex="0" aria-label="Интерактивная карта школы" aria-describedby="mapHelp">
    <div id="camera">
      <div id="scene">
        <img id="map" src="school-map.png" width="1536" height="1024" draggable="false" alt="Карта школы">
        <svg id="fx" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg id="hotspots" viewBox="0 0 1536 1024" preserveAspectRatio="none" role="group" aria-label="Интерактивные здания"></svg>
      </div>
    </div>
    <div id="hoverLabel" role="tooltip" hidden></div>
  </div>
  <p id="mapHelp" class="sr-only">Используйте стрелки для перемещения увеличенной карты, кнопки масштаба для приближения и клавишу Escape для закрытия карточки.</p>

  <aside id="card" role="dialog" aria-modal="false" aria-labelledby="cardTitle" aria-describedby="cardText" hidden>
    <button id="close" type="button" aria-label="Закрыть карточку">×</button>
    <div id="cardIcon" aria-hidden="true"></div><small id="cardKind"></small>
    <h1 id="cardTitle"></h1><p id="cardText"></p>
    <div class="line" aria-hidden="true"></div><span class="hint">Нажмите на другое здание или Esc</span>
  </aside>

  <div class="controls">
    <button id="zoomIn" type="button" title="Увеличить" aria-label="Увеличить карту">+</button>
    <button id="zoomOut" type="button" title="Уменьшить" aria-label="Уменьшить карту">−</button>
    <button id="reset" type="button" title="Показать всю карту" aria-label="Показать всю карту">⌂</button>
  </div>
  <div class="status"><span class="live-dot" aria-hidden="true"></span> ЖИВОЙ ГОРОД</div>
</main>
<script src="script.js?v=9"></script>
</body></html>
